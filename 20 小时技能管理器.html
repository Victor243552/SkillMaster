<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>维克多 | 20小时技能养成</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#4f46e5',
        secondary: '#10b981',
        neutral: '#f3f4f6',
        darkcard: '#ffffff',
        progress: '#6366f1',
        remaining: '#e5e7eb'
      },
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif']
      }
    }
  }
}
</script>
<style>
body {
  background-color: #f9fafb;
}
.card-shadow {
  box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04), 0 8px 10px -6px rgba(0,0,0,0.02);
}
.circle-progress {
  transform: rotate(-90deg);
}
</style>
</head>
<body class="min-h-screen pb-20">

<header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-semibold text-gray-800">维克多 · 20小时技能养成</h1>
      <p class="text-sm text-gray-500 mt-1">专注积累，告别三分钟热度</p>
    </div>
    <button id="openAddModal" class="px-4 py-2 bg-primary text-white rounded-xl hover:bg-indigo-600 transition">
      <i class="fa fa-plus mr-1"></i> 添加项目
    </button>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 mt-6">
  <div class="flex gap-3 mb-6">
    <button class="category-btn active px-4 py-2 bg-primary text-white rounded-xl" data-type="all">全部</button>
    <button class="category-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-xl" data-type="学习">学习</button>
    <button class="category-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-xl" data-type="工作">工作</button>
    <button class="category-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-xl" data-type="爱好">爱好</button>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 mb-8">
  <div class="bg-white rounded-2xl p-5 card-shadow">
    <h2 class="text-lg font-medium text-gray-800 mb-3">今日待完成</h2>
    <div id="todayTaskWrap" class="text-gray-500 text-sm">
      完成学习后，今日任务将自动生成建议
    </div>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="skillList"></div>

<div id="addModal" class="fixed inset-0 bg-black/30 z-50 hidden items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-3xl p-6 mx-4">
    <h3 class="text-lg font-semibold mb-4">新建技能项目</h3>
    <div class="space-y-4">
      <input type="text" id="newName" placeholder="项目名称（如：手绘、Python、游泳）" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
      <select id="newCate" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
        <option value="学习">学习</option>
        <option value="工作">工作</option>
        <option value="爱好">爱好</option>
      </select>
      <div class="flex gap-2">
        <button id="closeModal" class="flex-1 py-3 bg-gray-100 rounded-xl">取消</button>
        <button id="confirmAdd" class="flex-1 py-3 bg-primary text-white rounded-xl">创建</button>
      </div>
    </div>
  </div>
</div>

<div id="logModal" class="fixed inset-0 bg-black/30 z-50 hidden items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-3xl p-6 mx-4">
    <h3 class="text-lg font-semibold mb-4">记录学习时长</h3>
    <input type="number" id="logMinutes" placeholder="输入分钟数" class="w-full px-4 py-3 border border-gray-200 rounded-xl mb-4">
    <div class="flex gap-2">
      <button id="closeLogModal" class="flex-1 py-3 bg-gray-100 rounded-xl">取消</button>
      <button id="confirmLog" class="flex-1 py-3 bg-primary text-white rounded-xl">保存</button>
    </div>
  </div>
</div>

<script>
const TARGET_HOURS = 20;
const TARGET_MINUTES = TARGET_HOURS * 60;

// ==============================================
// 用户名：维克多
// 已内置你所有的技能项目
// ==============================================
let skills = JSON.parse(localStorage.getItem('skills_20h_victor')) || [
  { name: "复盘焦煤", cate: "工作", minutes: 0 },
  { name: "复盘碳酸锂", cate: "工作", minutes: 0 },
  { name: "复盘黄金", cate: "工作", minutes: 0 },
  { name: "复盘白银", cate: "工作", minutes: 0 },
  { name: "数学微积分", cate: "学习", minutes: 0 },
  { name: "数学概率学", cate: "学习", minutes: 0 },
  { name: "AI课程", cate: "学习", minutes: 0 },
  { name: "游泳", cate: "爱好", minutes: 0 },
  { name: "英语", cate: "学习", minutes: 0 },
  { name: "日语", cate: "学习", minutes: 0 },
  { name: "韩语", cate: "学习", minutes: 0 },
];

let currentEditIndex = null;
const skillListEl = document.getElementById('skillList');
const todayTaskWrap = document.getElementById('todayTaskWrap');

document.getElementById('openAddModal').onclick = () => {
  document.getElementById('addModal').style.display = 'flex';
};
document.getElementById('closeModal').onclick = () => {
  document.getElementById('addModal').style.display = 'none';
};
document.getElementById('closeLogModal').onclick = () => {
  document.getElementById('logModal').style.display = 'none';
};

document.getElementById('confirmAdd').onclick = () => {
  const name = document.getElementById('newName').value.trim();
  const cate = document.getElementById('newCate').value;
  if (!name) return alert('请输入名称');
  skills.push({ name, cate, minutes: 0, createdAt: new Date().toLocaleDateString() });
  saveAndRender();
  document.getElementById('addModal').style.display = 'none';
  document.getElementById('newName').value = '';
};

function save() {
  localStorage.setItem('skills_20h_victor', JSON.stringify(skills));
}

function render() {
  skillListEl.innerHTML = skills.map((s, idx) => {
    const percent = Math.min(100, (s.minutes / TARGET_MINUTES * 100).toFixed(1));
    const radius = 32;
    const circ = 2 * Math.PI * radius;
    const dash = (percent / 100) * circ;
    const h = Math.floor(s.minutes / 60);
    const m = s.minutes % 60;

    let color = '#4f46e5';
    if (s.cate === '工作') color = '#0ea5e9';
    if (s.cate === '爱好') color = '#10b981';

    return `
    <div class="bg-white rounded-2xl p-5 card-shadow skill-card" data-cate="${s.cate}">
      <div class="flex justify-between items-start mb-3">
        <div>
          <span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600">${s.cate}</span>
          <h3 class="text-base font-semibold mt-2 text-gray-800">${s.name}</h3>
        </div>
        <button onclick="delSkill(${idx})" class="text-gray-400 hover:text-red-500 text-sm">
          <i class="fa fa-trash-o"></i>
        </button>
      </div>

      <div class="flex items-center gap-5 my-4">
        <div class="relative w-20 h-20 flex-shrink-0">
          <svg class="circle-progress w-full h-full" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="${radius}" fill="none" stroke="#e5e7eb" stroke-width="6"></circle>
            <circle cx="40" cy="40" r="${radius}" fill="none" stroke="${color}" stroke-width="6"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ - dash}"></circle>
          </svg>
          <div class="absolute inset-0 flex items-center justify-center text-sm font-medium">
            ${percent}%
          </div>
        </div>
        <div class="text-sm text-gray-600">
          <div>已学习：${h}h ${m}m</div>
          <div>目标：20小时</div>
        </div>
      </div>

      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div style="width:${percent}%; background:${color}" class="h-full rounded-full"></div>
      </div>

      <button onclick="openLog(${idx})" class="mt-4 w-full py-2 bg-indigo-50 text-primary rounded-xl hover:bg-indigo-100 transition">
        <i class="fa fa-clock-o mr-1"></i> 记录学习
      </button>
    </div>`;
  }).join('');

  const sorted = [...skills].sort((a,b)=>
    (a.minutes/(TARGET_MINUTES)) - (b.minutes/(TARGET_MINUTES))
  );
  const first = sorted[0];
  if (first) {
    const p = (first.minutes / TARGET_MINUTES * 100).toFixed(1);
    todayTaskWrap.innerHTML = `
      <div class="flex items-center justify-between">
        <div>
          <span class="font-medium text-gray-700">推荐今日学习：</span>
          <span class="text-primary font-medium">${first.name}</span>
          <div class="text-gray-500 text-xs mt-1">当前进度 ${p}%，建议学习 20–40 分钟</div>
        </div>
        <button onclick="openLog(${skills.indexOf(first)})" class="px-3 py-1.5 bg-primary/10 text-primary rounded-lg text-sm">
          去打卡
        </button>
      </div>
    `;
  }
}

function openLog(index) {
  currentEditIndex = index;
  document.getElementById('logModal').style.display = 'flex';
  document.getElementById('logMinutes').value = '';
}
document.getElementById('confirmLog').onclick = () => {
  const min = Number(document.getElementById('logMinutes').value);
  if (!min || min <= 0) return alert('请输入有效时长');
  skills[currentEditIndex].minutes += min;
  saveAndRender();
  document.getElementById('logModal').style.display = 'none';
};

function delSkill(idx) {
  if (!confirm('确定删除该项目？')) return;
  skills.splice(idx, 1);
  saveAndRender();
}

function saveAndRender() {
  save();
  render();
}

document.querySelectorAll('.category-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.category-btn').forEach(b => {
      b.classList.remove('active', 'bg-primary', 'text-white');
      b.classList.add('bg-gray-100', 'text-gray-700');
    });
    btn.classList.add('active', 'bg-primary', 'text-white');
    btn.classList.remove('bg-gray-100', 'text-gray-700');
    const t = btn.dataset.type;
    const cards = document.querySelectorAll('.skill-card');
    cards.forEach(c => {
      if (t === 'all' || c.dataset.cate === t) c.style.display = '';
      else c.style.display = 'none';
    });
  };
});

render();
</script>
</body>
</html>
